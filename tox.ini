[tox]
envlist = py313
skipsdist = true

[testenv]
description = Run pytest with coverage and minimum 70% threshold
basepython = python3.13
deps =
    -rrequirements.txt
    pytest
    pytest-django
    pytest-cov
    pytest-dotenv
setenv =
    PYTHONPATH = {toxinidir}/src
    DJANGO_SETTINGS_MODULE = core.settings
    # DB_ENGINE = mysql
    DB_HOST=127.0.0.1
passenv =
    DJANGO_*
    DATABASE_*
    ENV*
    SECRET_KEY
    DEBUG
    DOMAIN
    WEB_PORT
    DB_*
    JWT_*
commands =
    pytest -q \
      --cov=src \
      --cov-report=term-missing \
      --cov-report=xml \
      --cov-report=html \
      --cov-fail-under=70